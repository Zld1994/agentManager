name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentmanager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        id: unit-tests
        run: |
          pytest tests/unit/ -v --cov=agentManager --cov-report=term-missing --cov-report=xml
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentmanager_test

      - name: Check coverage threshold
        id: coverage-threshold
        if: matrix.python-version == '3.10' || matrix.python-version == '3.12'
        run: |
          coverage report --fail-under=80

      - name: Run e2e tests
        id: e2e-tests
        run: |
          pytest tests/e2e/ -v --no-cov
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentmanager_test

      - name: Run mypy type checking (core modules)
        id: mypy-core
        run: |
          mypy agentManager/runtime/ agentManager/storage/ agentManager/config/ --ignore-missing-imports --explicit-package-bases --follow-imports=skip

      - name: Run mypy type checking (advisory)
        id: mypy-advisory
        if: always()
        run: |
          mypy agentManager/ --ignore-missing-imports --explicit-package-bases || true

      - name: Run flake8 code style check
        id: flake8
        run: |
          flake8 agentManager/ tests/ --max-line-length=100 --count --statistics

      - name: Run durable backend integration tests
        id: durable-tests
        run: |
          pytest tests/unit/test_storage_backends.py tests/unit/test_state_manager.py tests/unit/test_checkpoint.py tests/unit/test_redis_stream_event_bus.py -v --no-cov
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentmanager_test

      - name: Generate verification summary
        if: always()
        run: |
          python scripts/collect_ci_status.py \
            --output ".test-artifacts/verification-summary-python-${{ matrix.python-version }}.md" \
            --python-version "${{ matrix.python-version }}" \
            --command-result "${{ steps.unit-tests.outcome || 'unknown' }}::pytest tests/unit/ -v --cov=agentManager --cov-report=term-missing --cov-report=xml::unit tests with coverage" \
            --command-result "${{ steps.coverage-threshold.outcome || 'skipped' }}::coverage report --fail-under=80::coverage threshold on Python 3.10 and 3.12" \
            --command-result "${{ steps.e2e-tests.outcome || 'unknown' }}::pytest tests/e2e/ -v --no-cov::end-to-end tests" \
            --command-result "${{ steps.mypy-core.outcome || 'unknown' }}::mypy agentManager/runtime/ agentManager/storage/ agentManager/config/ --ignore-missing-imports::type checking (core modules - blocking)" \
            --command-result "${{ steps.mypy-advisory.outcome || 'unknown' }}::mypy agentManager/ --ignore-missing-imports || true::type checking (advisory)" \
            --command-result "${{ steps.flake8.outcome || 'unknown' }}::flake8 agentManager/ tests/ --max-line-length=100 --count --statistics::code style check" \
            --command-result "${{ steps.durable-tests.outcome || 'unknown' }}::pytest tests/unit/test_storage_backends.py tests/unit/test_state_manager.py tests/unit/test_checkpoint.py tests/unit/test_redis_stream_event_bus.py -v --no-cov::durable backend integration tests"

      - name: Upload verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary-python-${{ matrix.python-version }}
          path: .test-artifacts/verification-summary-python-${{ matrix.python-version }}.md
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  docker-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker and Compose availability
        run: |
          if ! command -v docker > /dev/null 2>&1; then
            echo "SKIP_DOCKER_VERIFY=1" >> "$GITHUB_ENV"
            echo "DOCKER_SKIP_REASON=Docker CLI is not available on the runner" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! docker info > /dev/null 2>&1; then
            echo "SKIP_DOCKER_VERIFY=1" >> "$GITHUB_ENV"
            echo "DOCKER_SKIP_REASON=Docker daemon is not available on the runner" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! docker compose version > /dev/null 2>&1; then
            echo "SKIP_DOCKER_VERIFY=1" >> "$GITHUB_ENV"
            echo "DOCKER_SKIP_REASON=Docker Compose v2 is not available on the runner" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Verify compose syntax
        if: env.SKIP_DOCKER_VERIFY != '1'
        run: docker compose config

      - name: Pull base image with retry
        if: env.SKIP_DOCKER_VERIFY != '1'
        id: pull-base
        run: |
          for i in 1 2 3; do
            if docker pull python:3.11-slim; then
              echo "Base image pulled successfully on attempt $i"
              exit 0
            fi
            echo "Pull attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All pull attempts failed, marking docker builds as skipped"
          echo "SKIP_DOCKER_BUILD=1" >> "$GITHUB_ENV"
          echo "DOCKER_SKIP_REASON=Docker image builds skipped because python:3.11-slim could not be pulled" >> "$GITHUB_ENV"

      - name: Build production image
        if: env.SKIP_DOCKER_VERIFY != '1' && env.SKIP_DOCKER_BUILD != '1'
        run: docker build -f Dockerfile.prod -t agentmanager:prod .

      - name: Build development image
        if: env.SKIP_DOCKER_VERIFY != '1' && env.SKIP_DOCKER_BUILD != '1'
        run: docker build -f Dockerfile.dev -t agentmanager:dev .

      - name: Report docker-verify status
        if: always()
        run: |
          if [ "${SKIP_DOCKER_VERIFY:-0}" = "1" ] || [ "${SKIP_DOCKER_BUILD:-0}" = "1" ]; then
            echo "::warning::${DOCKER_SKIP_REASON:-Docker verification was skipped}"
          else
            echo "Docker verification completed without skip conditions"
          fi

  sandbox-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sandbox]"

      - name: Check Docker availability
        run: |
          if ! command -v docker > /dev/null 2>&1; then
            echo "Docker CLI not available, skipping sandbox integration tests"
            echo "SKIP_SANDBOX_TESTS=1" >> "$GITHUB_ENV"
            echo "SANDBOX_SKIP_REASON=Docker CLI is not available on the runner" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! docker info > /dev/null 2>&1; then
            echo "Docker not available, skipping sandbox integration tests"
            echo "SKIP_SANDBOX_TESTS=1" >> "$GITHUB_ENV"
            echo "SANDBOX_SKIP_REASON=Docker daemon is not available on the runner" >> "$GITHUB_ENV"
          fi

      - name: Pull sandbox image
        if: env.SKIP_SANDBOX_TESTS != '1'
        run: |
          for i in 1 2 3; do
            if docker pull python:3.11-slim; then
              echo "Sandbox image pulled successfully on attempt $i"
              exit 0
            fi
            echo "Pull attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All pull attempts failed, skipping sandbox tests"
          echo "SKIP_SANDBOX_TESTS=1" >> "$GITHUB_ENV"
          echo "SANDBOX_SKIP_REASON=Sandbox integration skipped because python:3.11-slim could not be pulled" >> "$GITHUB_ENV"

      - name: Run Docker sandbox integration tests
        if: env.SKIP_SANDBOX_TESTS != '1'
        run: pytest tests/integration/test_sandbox_docker.py -v --no-cov -m integration

      - name: Report sandbox integration status
        if: always()
        run: |
          if [ "${SKIP_SANDBOX_TESTS:-0}" = "1" ]; then
            echo "::warning::${SANDBOX_SKIP_REASON:-Sandbox integration tests were skipped}"
          else
            echo "Sandbox integration completed without skip conditions"
          fi
