[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentManager"
version = "0.1.0"
description = "AI Agent Orchestration Control Plane Prototype"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Zld1994", email = "649077883@qq.com"}
]
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "networkx>=3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "redis>=5.0.0",
    "prometheus-client>=0.17.0",
    "psutil>=5.9",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "qdrant-client>=1.7",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0,<2.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "httpx>=0.25",
]

sandbox = [
    "docker>=6.1",
]

otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["agentManager", "agentManager.*", "scheduler", "scheduler.*"]}}

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=agentManager --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: tests requiring real Docker services (Postgres, Redis, MinIO, Qdrant)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]
