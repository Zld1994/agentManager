# Alert rules for agentManager.
#
# Metric names reference the Prometheus counters/histograms defined in
# agentManager/api.py:
#   agentmanager_tasks_total        (Counter, label: task_type)
#   agentmanager_errors_total       (Counter, label: error_type)
#   agentmanager_repairs_total      (Counter, label: repair_type)
#   agentmanager_task_duration_seconds (Histogram, label: task_type)

groups:
  - name: agentmanager_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(agentmanager_errors_total[5m])) /
          sum(rate(agentmanager_tasks_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      - alert: TaskExecutionTimeout
        expr: |
          (
            sum(rate(agentmanager_task_duration_seconds_count[5m]))
            -
            sum(rate(agentmanager_task_duration_seconds_bucket{le="60"}[5m]))
          ) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tasks exceeding 60s duration"
          description: "{{ $value }} tasks/s took longer than 60s in the last 5 minutes"

      - alert: SandboxDeniedIncreased
        expr: |
          sum(rate(agentmanager_errors_total{error_type="sandbox_denied"}[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Sandbox denials increased"
          description: "{{ $value }} sandbox denials per second in the last 5 minutes"

      - alert: RecoveryUpgradeExcessive
        expr: |
          sum(rate(agentmanager_repairs_total[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Excessive recovery upgrades"
          description: "{{ $value }} repairs per second in the last 5 minutes"

      - alert: ApiHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(agentmanager_task_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile latency is {{ $value }}s"
